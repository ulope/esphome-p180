# P180 register discovery config.
#
# Flash this once, then do every experiment from the Home Assistant UI and the
# ESPHome log - no recompile needed per register. See the "Register discovery"
# section of the README for the experiment matrix.
#
# This config is read-only. The component never issues Modbus writes.
#
# The ESP32 is its own device here; the battery is registered as a sub-device so
# its entities group under "AFERIY P180" in Home Assistant rather than taking
# over the whole node. Requires ESPHome 2025.7.0 or newer.

esphome:
  # The ESP32 itself - this is the hostname and OTA identity, not the battery.
  name: esp32-ble-gateway
  friendly_name: ESP32 BLE Gateway
  min_version: 2025.7.0
  devices:
    - id: p180_device
      name: "AFERIY P180"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  logs:
    p180: DEBUG

    # Entities log their own state on the device at VERBOSE. Which level that
    # lands on has moved between ESPHome versions, so mute the tags by name
    # rather than relying on the global level. A per-tag level may only ever be
    # LESS verbose than `level:` above; WARN still lets real problems through.
    #
    # NOTE: this does NOT stop lines like
    #
    #   [S][sensor]: 'Battery' >> 64 %
    #
    # Those are not device logs at all - aioesphomeapi renders them host-side
    # from the API state stream, so no logger: setting touches them. Tell them
    # apart by the missing `tag:line` ([S][sensor] vs [D][p180:330]). Turn them
    # off with `esphome logs <config>.yaml --no-states`, or the environment
    # variable ESPHOME_LOG_STATES=false. The dashboard and the Home Assistant
    # ESPHome Device Builder add-on pass no flag, so they default to showing
    # them - run the CLI with --no-states for a clean log there.
    sensor: WARN
    binary_sensor: WARN
    button: WARN
    number: WARN

  # Only if you need the p180 frame-level diagnostics (reassembly, stray
  # notifications, CRC detail). Raising the global level to VERBOSE also
  # un-mutes every other component, so mute the loud ones too:
  #
  # level: VERBOSE
  # logs:
  #   p180: VERBOSE
  #   sensor: WARN
  #   binary_sensor: WARN
  #   button: WARN
  #   number: WARN
  #   ble_client: WARN          # very chatty at VERBOSE
  #   esp32_ble_tracker: WARN   # ditto, especially with bluetooth_proxy
  #   api: WARN
  #   wifi: WARN

external_components:
  - source:
      type: git
      url: https://github.com/ulope/esphome-p180
      ref: main
    components: [p180]
    refresh: 0s

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"   # your P180's BLE MAC
    id: p180_ble

p180:
  id: p180_main
  ble_client_id: p180_ble
  polling_interval: 5s
  settings_interval: 60s

  # --- discovery options ---
  # Log every register that changed since the previous frame. This is the
  # workhorse: press "Reset Baseline", change exactly one thing on the station,
  # and read off which register moved.
  log_changes: true
  # Registers that move on their own and would otherwise drown out the signal.
  # 72 is free-running: it wanders on every single poll (4502..7203 observed)
  # with no correlation to anything you do. Add more as you find them.
  ignore_registers: [12, 13, 31, 72]
  # 0, not 1: with 72 muted by name there is no jitter left to filter, and the
  # slow-moving registers on a resting unit move by exactly 1.
  change_threshold: 0
  # Set true to dump the whole table every poll. Very noisy - the dump buttons
  # below are usually what you want instead.
  debug_dump: false

button:
  - platform: p180
    p180_id: p180_main
    action: reset_baseline
    name: "Reset Baseline"
    device_id: p180_device
  - platform: p180
    p180_id: p180_main
    action: dump_input
    name: "Dump Status Registers"
    device_id: p180_device
  - platform: p180
    p180_id: p180_main
    action: dump_holding
    name: "Dump Settings Registers"
    device_id: p180_device
  - platform: p180
    p180_id: p180_main
    action: probe_extended
    name: "Probe Extended Registers"
    device_id: p180_device

sensor:
  # Known-good sensors, so you can sanity check against the AFERIY app.
  - platform: p180
    p180_id: p180_main
    ac_in_voltage:
      name: "AC Input Voltage"
      device_id: p180_device
    ac_in_frequency:
      name: "AC Input Frequency"
      device_id: p180_device
    battery_percent:
      name: "Battery"
      device_id: p180_device
    output_power:
      name: "Output Power"
      device_id: p180_device
    battery_discharge_power:
      name: "Battery Discharge Power"
      device_id: p180_device

    # Candidate registers under investigation. Add an entry here the moment a
    # diff line points at something interesting - no C++ change, no reflash of
    # the component source, just a recompile of this YAML.
    #
    # `source:` selects the table: `input` (0x04 status, the default) or
    # `holding` (0x03 settings).
    raw_registers:
      # Both move exactly in step with the USB output being toggled - confirmed
      # over five clean transitions on a real P180 Pro.
      - register: 75
        name: "Reg 75 (output status bits)"
        device_id: p180_device
      # 0x0837 with USB on, 0x0000 with it off. One frame caught it partway at
      # 0x0037, so the two bytes update independently: likely hi = status byte
      # (0x08, the same value reg 75 carries), lo = 0x37 = 55 = 5.5V.
      - register: 54
        name: "Reg 54 (USB-related)"
        device_id: p180_device
      - register: 66
        source: holding
        name: "Holding 66 (discharge floor candidate)"
        scale: 0.1
        device_id: p180_device

binary_sensor:
  - platform: p180
    p180_id: p180_main
    connected:
      name: "P180 Connected"
      device_id: p180_device
    grid_power:
      name: "Grid Power"
      device_id: p180_device

    # Reg 75 is the output status register on the P180 - NOT reg 41. Reg 41 sat
    # at 0x0000 through five USB transitions, so the Sydpower/P280 bitmask
    # layout does not apply to this device.
    raw_bits:
      # Confirmed: 0x0008 tracks the USB output exactly.
      - register: 75
        bitmask: 0x0008
        name: "USB Output Active"
        device_id: p180_device

      # The DC / AC / light flags are most likely other bits of reg 75. Toggle
      # each one, watch which bit of 75 moves, then fix the mask and drop the
      # "(unconfirmed)". These three masks are guesses, nothing more.
      - register: 75
        bitmask: 0x0004
        name: "DC Output Active (unconfirmed)"
        device_id: p180_device
      - register: 75
        bitmask: 0x0002
        name: "AC Output Active (unconfirmed)"
        device_id: p180_device
      - register: 75
        bitmask: 0x0001
        name: "Light On (unconfirmed)"
        device_id: p180_device
